jenkins:
  systemMessage: "PlaneGame Stage B: disabled by default; enablement requires independent approval"
  numExecutors: 0
  mode: EXCLUSIVE
  slaveAgentPort: -1
  quietPeriod: 5
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "plane-admin"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
  crumbIssuer:
    standard: {}
  remotingSecurity:
    enabled: true
  nodes:
    - permanent:
        name: "plane-game-cd-rootless"
        remoteFS: "/home/plane-preflight/jenkins-agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "plane-game-cd-rootless"
        launcher:
          ssh:
            host: "${trim:${readFile:/run/secrets/PLANE_AGENT_HOST}}"
            port: 22
            credentialsId: "plane-game-agent-ssh"
            javaPath: "/usr/bin/java"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${trim:${readFile:/run/secrets/PLANE_AGENT_ED25519_HOST_KEY}}"
        retentionStrategy: "always"
credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "plane-game-agent-ssh"
              description: "Stage B file-backed SSH credential for UID 1003 plane-preflight"
              username: "plane-preflight"
              privateKeySource:
                directEntry:
                  privateKey: "${trim:${readFile:/run/secrets/PLANE_AGENT_PRIVATE_KEY}}"
jobs:
  - file: /usr/share/jenkins/ref/jobs/plane-game-job.groovy
unclassified:
  location:
    url: "http://127.0.0.1:18080/"
