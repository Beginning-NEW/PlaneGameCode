# Merge this fragment into the controller's reviewed JCasC bundle.
# The credential value is intentionally absent from source control.
unclassified:
  whitelist:
    enabled: true
    whitelistItems:
      - host: ""
        hmacEnabled: true
        hmacHeader: "X-Hub-Signature-256"
        hmacCredentialId: "plane-github-webhook-secret"
        hmacAlgorithm: "HmacSHA256"
