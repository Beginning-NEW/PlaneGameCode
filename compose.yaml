name: plane-game
services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    labels:
      com.plane-game.deployment-id: "${PLANE_GAME_DEPLOYMENT_ID:-manual}"
    ports:
      - "127.0.0.1:${APP_PORT:?Select an audited free host port}:8080"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/active:/etc/nginx/active:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
