server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type application/json; add_header Cache-Control no-store; return 200 '{"status":"ok"}'; }
    location / { try_files $uri $uri/ =404; }
}
