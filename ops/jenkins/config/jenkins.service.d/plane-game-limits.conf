[Service]
Environment="JENKINS_PORT=18080"
Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
Environment="JAVA_OPTS=-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true"
MemoryAccounting=yes
MemoryHigh=448M
MemoryMax=512M
CPUAccounting=yes
CPUQuota=25%
TasksAccounting=yes
TasksMax=256
OOMPolicy=stop
Restart=on-failure
RestartSec=15s
StartLimitIntervalSec=30min
StartLimitBurst=3
